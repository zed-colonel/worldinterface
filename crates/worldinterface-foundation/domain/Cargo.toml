[package]
name = "worldinterface-domain"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Domain layer for WorldInterface durable embedded workflows"
license = "Apache-2.0"
repository = "https://github.com/zed-colonel/worldinterface"
readme = "README.md"
keywords = ["workflow", "embedded", "durable"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/support/**", "release/**", "tests/control_plane.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldinterface-protocol = { version = "=0.2.0-alpha.1", path = "../protocol" }

[dev-dependencies]
proptest = "1"
