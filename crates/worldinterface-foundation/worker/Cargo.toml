[package]
name = "worldinterface-worker"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Worker layer for WorldInterface durable embedded workflows"
license = "Apache-2.0"
repository = "https://github.com/zed-colonel/worldinterface"
readme = "README.md"
keywords = ["workflow", "embedded", "durable"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/support/**", "release/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldinterface-protocol = { version = "=0.2.0-alpha.1", path = "../protocol" }
worldinterface-capability = { version = "=0.2.0-alpha.1", path = "../capability" }
