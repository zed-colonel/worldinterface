version: 3
status: implementation-ready-foundational-completeness
date: '2026-07-25'
contract_revision: STACK-2026-07-25-FOUNDATIONAL-2
reference_syntax: ref://<system>/<kind>/<id> (illustrative, opaque, non-normative)
dependency_direction:
- AQ-CONT-1
- WI-FABRIC-2
- EXO-V3
clean_break:
  pre_contract_code: evidence-not-runtime-dependency
  authoritative_paths: 1
  live_dual_authority: false
  old_format_runtime_readers: false
  silent_semantic_migration: false
  offline_fixture_comparison: true
  future_stability_begins_at_target_release: true
optional_adjacent_foundation:
  name: portable-identity-foundation
  examples:
  - EntityID
  - KERI
  - W3C Controlled Identifier profile
  - certificate or organizational identity
  integration_owner: WI-FABRIC-2
  required: false
  claims:
  - control-lineage-and-provenance
  - not-unique-personhood
  - not-semantic-truth
  - not-automatic-authority
contracts:
  AQ-CONT-1:
    repository: zed-colonel/actionqueue
    responsibility: Durable opaque execution, compound idempotent admission, run/attempt lifecycle, Awaiting, durable signals, checkpoints, opaque causal-reference propagation, and recovery.
    depends_on: []
    conformance_path: conformance/aq-cont-1
    owns:
    - task/run/attempt lifecycle
    - compound admission
    - Awaiting
    - durable signals
    - checkpoints
    - opaque causal references
    - WAL replay and recovery
    must_not_own:
    - Vessel semantics
    - external identity resolution
    - effect or receipt meaning
    - authorization over external resources
    - narrative, belief, role, or lifecycle meaning
  WI-FABRIC-2:
    repository: zed-colonel/worldinterface
    responsibility: Verified operational agency, portable-identity and role-attestation bindings, explicit acting capacity, canonical resource and audience resolution, purpose- and information-use-aware final authorization, accountable observations and effects, lifecycle operations, component provenance, proof bundles, delivery, reconciliation, receipts, and deterministic boundary workflows.
    depends_on:
    - AQ-CONT-1
    conformance_path: conformance/wi-fabric-2
    owns:
    - verified operational agency
    - identity bindings and external attestations
    - acting-capacity references at the boundary
    - resource/audience resolution
    - final authorization
    - ingress observations
    - effect intents
    - information-use enforcement at boundary crossings
    - lifecycle and deployment effects
    - receipts, provenance, uncertainty, and reconciliation
    - Flow
    - worker and sandbox controls
    must_not_own:
    - internal Vessel genesis or identity continuity
    - cognitive arbitration or belief admission
    - internal role meaning or relationship trust
    - commitment or mission admission
    - improvement acceptance or autobiographical narrative
    - mandatory EntityID/blockchain/token/global reputation
  EXO-V3:
    repository: zed-colonel/exoskeleton
    responsibility: Vessel blueprint and genesis, identity and lifecycle, Purpose Charter, roles and acting capacity, governed mission and commitment admission, initiative, interaction, communication, cognitive faculties, constitutions, epistemic state and semantic time, relationships, memory, narrative continuity, information-use obligations, viability, external personas, delegation, verification, developmental integrity, governed self-improvement, and acceptance.
    depends_on:
    - WI-FABRIC-2
    - AQ-CONT-1
    conformance_path: conformance/exo-v3
    owns:
    - Vessel blueprint, manifest, genesis, commissioning state, activation, and lineage
    - Vessel identity and lifecycle
    - Purpose Charter, autonomy profile, roles, and acting capacity
    - mission offers, commitments, goals, plans, and portfolio admission
    - communication, attention, faculties, and constitutions
    - beliefs, hypotheses, assumptions, semantic time, and epistemic revision
    - relationships, memory, self-model, narrative, and information obligations
    - viability and degraded operating modes
    - external personas
    - delegation, verification, skills, behavioral components, improvement proposals, continuity assessment, and acceptance
    must_not_own:
    - root key custody
    - final WorldInterface authorization
    - specialist backend process outside Agent Host
    - activation credentials or the sole lifecycle supervisor
    - collective narrative in v3
handoff_rule:
- source authoritative record plus outbox
- idempotent downstream admission
- downstream authoritative record plus signal outbox
- opaque ActionQueue wake-up or task reference
specialized_handoffs:
  commissioning:
  - Exoskeleton commits GenesisRecord and commissioning outbox
  - WorldInterface performs bounded commissioning effects and emits receipts
  - Exoskeleton records commissioning evidence and decides activation
  improvement:
  - Exoskeleton freezes ImprovementProposal and EvaluationPlan
  - WorldInterface provisions isolated candidate development, build, trial, activation, and rollback effects
  - external lifecycle supervisor performs authorized version transition
  - Exoskeleton records continuity and developmental history
  information_use:
  - Exoskeleton owns social and epistemic use obligations
  - WorldInterface enforces disclosure, export, audience, retention-trigger, and proof-publication constraints at crossings
removed_target_paths:
  ActionQueue:
  - HandlerOutput
  - fire-and-forget TaskSubmissionPort
  - transient custom external events
  - ActorCapabilities
  - pre-AQ-CONT-1 runtime readers
  WorldInterface:
  - signal.await
  - signal.emit
  - SignalRegistry
  - blocking delay connector
  - coding-specific Fabric connectors
  - old receipt path
  - anonymous compatibility principal
  Exoskeleton:
  - Decide sovereignty
  - Align
  - SessionApprovals
  - caelum.wake
  - local reply-as-sent
  - native coding thread/tools
  - prose bootstrap as authoritative identity creation
  - live in-place self-modification
  - live v1/v3 shadow authority
  - pre-v3 store readers
conformance:
  package_ownership:
    AQ-CONT-1: actionqueue/conformance/aq-cont-1
    WI-FABRIC-2: worldinterface/conformance/wi-fabric-2
    EXO-V3: exoskeleton/conformance/exo-v3
  revision_policy: additive coverage increments package revision; normative semantic change requires explicit contract amendment
  pinning: downstream release manifests pin exact upstream implementation and conformance revisions
  release_order:
  - ActionQueue AQ-CONT-1
  - WorldInterface WI-FABRIC-2
  - Exoskeleton EXO-V3
