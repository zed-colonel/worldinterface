[workspace]
resolver = "2"

[package]
name = "worldinterface-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
actionqueue-core = { version = "=0.2.0", default-features = false, features = ["serde"] }
actionqueue-runtime = { version = "=0.2.0", default-features = false, features = ["serde"] }
actionqueue-storage = { version = "=0.2.0", default-features = false }
actionqueue-executor-local = "=0.2.0"
worldinterface-protocol = { path = "../worldinterface-foundation/protocol" }
worldinterface-storage = { path = "../worldinterface-foundation/storage" }
worldinterface-domain = { path = "../worldinterface-foundation/domain" }
worldinterface-ingress = { path = "../worldinterface-foundation/ingress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
hex = "0.4"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
