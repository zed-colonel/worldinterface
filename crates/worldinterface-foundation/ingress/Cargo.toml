[package]
name = "worldinterface-ingress"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
worldinterface-protocol = { path = "../protocol" }
worldinterface-domain = { path = "../domain" }
worldinterface-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
