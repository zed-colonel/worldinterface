name: WI production integration
on:
  push:
    branches: [main, wi-fabric-2, wi-worker-proof-1]
  pull_request:
    branches: [main, wi-fabric-2, wi-worker-proof-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify the runtime against published AQ 0.2.0 from crates.io
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$RUNNER_TEMP/wi-integration-target}"
          export TMPDIR="${TMPDIR:-$RUNNER_TEMP/wi-integration-scratch}"
          mkdir -p "$RUNNER_TEMP/evidence" "$TMPDIR"
          scripts/check-wi-integration.sh 2>&1 | tee "$RUNNER_TEMP/evidence/wi-integration.log"
