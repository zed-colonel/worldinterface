name: WI G1 production integration
on:
  push:
    branches: [wi-fabric-2]
  pull_request:
    branches: [wi-fabric-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify WI-02 against current exact AQ pin
        shell: bash
        run: |
          set -euo pipefail
          : "${CRAFTINGTABLE_DEPENDENCY_MANIFEST:?controller provisioning required}"
          : "${CRAFTINGTABLE_CARGO_CONFIG:?controller Cargo config required}"
          : "${CRAFTINGTABLE_CI_ARTIFACTS_DIR:?external evidence directory required}"
          : "${CRAFTINGTABLE_VERIFICATION_MODE:?verification mode required}"
          test "$CRAFTINGTABLE_VERIFICATION_MODE" = current-upstream-build
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$RUNNER_TEMP/wi-integration-target}"
          export TMPDIR="${TMPDIR:-$RUNNER_TEMP/wi-integration-scratch}"
          mkdir -p "$CRAFTINGTABLE_CI_ARTIFACTS_DIR" "$TMPDIR"
          scripts/check-wi-integration.sh 2>&1 | tee "$CRAFTINGTABLE_CI_ARTIFACTS_DIR/wi-integration.log"
