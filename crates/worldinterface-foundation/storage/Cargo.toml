[package]
name = "worldinterface-storage"
version = "0.2.0"
edition = "2021"
publish = false

[features]
crash-points = []

[dependencies]
fs2 = "0.4"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldinterface-protocol = { path = "../protocol" }
worldinterface-domain = { path = "../domain" }
rusqlite = { version = "0.32", features = ["bundled"] }

tempfile = "3"
