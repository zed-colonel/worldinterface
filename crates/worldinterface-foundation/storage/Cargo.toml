[package]
name = "worldinterface-storage"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Storage layer for WorldInterface durable embedded workflows"
license = "Apache-2.0"
repository = "https://github.com/zed-colonel/worldinterface"
readme = "README.md"
keywords = ["workflow", "embedded", "durable"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/support/**", "release/**", "tests/continuation.rs", "tests/worker.rs"]

[features]
crash-points = []

[dependencies]
fs2 = "0.4"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldinterface-protocol = { version = "=0.2.0-alpha.1", path = "../protocol" }
worldinterface-domain = { version = "=0.2.0-alpha.1", path = "../domain" }
rusqlite = { version = "0.32", features = ["bundled"] }

tempfile = "3"
