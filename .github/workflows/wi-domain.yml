name: WI protocol, store and ingress domain
on:
  push:
    branches: [wi-fabric-2]
  pull_request:
    branches: [wi-fabric-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify independent WI-02, WI-03 and WI-09 domain obligations
        shell: bash
        run: |
          set -euo pipefail
          : "${CRAFTINGTABLE_DEPENDENCY_MANIFEST:?controller provisioning required}"
          : "${CRAFTINGTABLE_CARGO_CONFIG:?controller Cargo config required}"
          : "${CRAFTINGTABLE_CI_ARTIFACTS_DIR:?external evidence directory required}"
          : "${CRAFTINGTABLE_VERIFICATION_MODE:?verification mode required}"
          case "$CRAFTINGTABLE_VERIFICATION_MODE" in scoped-checks|current-upstream-build) ;; *) exit 1;; esac
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$RUNNER_TEMP/wi-domain-target}"
          export TMPDIR="${TMPDIR:-$RUNNER_TEMP/wi-domain-scratch}"
          mkdir -p "$CRAFTINGTABLE_CI_ARTIFACTS_DIR" "$TMPDIR"
          scripts/check-wi-domain.sh 2>&1 | tee "$CRAFTINGTABLE_CI_ARTIFACTS_DIR/wi-domain.log"
