[workspace]
resolver = "2"

[package]
name = "worldinterface-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
publish = false

[[bin]]
name = "wi-process-reaper"
path = "src/bin/wi-process-reaper.rs"
test = false
bench = false

[[bin]]
name = "wi-process-fixture"
path = "src/bin/wi-process-fixture.rs"
test = false
bench = false

[dependencies]
worldinterface-capability = { path = "../worldinterface-foundation/capability" }
actionqueue-core = { version = "=0.3.0", default-features = false, features = ["serde"] }
actionqueue-runtime = { version = "=0.3.0", default-features = false, features = ["serde"] }
actionqueue-storage = { version = "=0.3.0", default-features = false }
actionqueue-executor-local = "=0.3.0"
worldinterface-protocol = { path = "../worldinterface-foundation/protocol" }
worldinterface-storage = { path = "../worldinterface-foundation/storage" }
worldinterface-domain = { path = "../worldinterface-foundation/domain" }
worldinterface-egress = { path = "../worldinterface-foundation/egress" }
worldinterface-worker = { path = "../worldinterface-foundation/worker" }
worldinterface-ingress = { path = "../worldinterface-foundation/ingress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
hex = "0.4"
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
worldinterface-storage = { path = "../worldinterface-foundation/storage", features = ["crash-points"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"

# Keep executable artifacts below the local store's 16 MiB bound. Debug information
# is independent of debug assertions and the debug-only native crash seams.
[profile.dev]
debug = 0

# Keep the sustained 10,000-admission/recovery proof practical without disabling
# debug invariants or the debug-only native crash-injection seams.
[profile.test]
debug = 0
opt-level = 3
codegen-units = 16
debug-assertions = true
overflow-checks = true
