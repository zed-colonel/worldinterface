[package]
name = "worldinterface-ingress"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Ingress layer for WorldInterface durable embedded workflows"
license = "Apache-2.0"
repository = "https://github.com/zed-colonel/worldinterface"
readme = "README.md"
keywords = ["workflow", "embedded", "durable"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/support/**", "release/**"]

[dependencies]
worldinterface-protocol = { version = "=0.2.0-alpha.1", path = "../protocol" }
worldinterface-domain = { version = "=0.2.0-alpha.1", path = "../domain" }
worldinterface-storage = { version = "=0.2.0-alpha.1", path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
